<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="safegate-output-title safegate-output-desc" id="safegate-output-root">
<title id="safegate-output-title">safegate output path</title>
<desc id="safegate-output-desc">Allowed or redacted prompts go to the LLM, whose stream passes a 64-character sliding buffer and then a full-output post-gen check that releases the text to the user or withholds it, while every stage writes to the request trace.</desc>
<defs>
      <style>#safegate-output-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #safegate-output-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#safegate-output-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="safegate-output-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker>
<marker id="safegate-output-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
<marker id="safegate-output-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
