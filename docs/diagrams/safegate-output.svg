ffff"/><text x="736" y="175" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">CLEAN/REDACTED</text><rect x="24" y="40" width="144" height="64" rx="6" fill="#ffffff"/><rect x="24" y="40" width="144" height="64" rx="6" fill="#1f2328" stroke="#1f2328" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="96" y="67.5" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">RulesEngine</text><text x="96" y="83.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">from the input path</text><rect x="24" y="152" width="144" height="64" rx="6" fill="#ffffff"/><rect x="24" y="152" width="144" height="64" rx="6" fill="#1f2328" stroke="#1f2328" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="96" y="188" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">LLM</text><rect x="280" y="144" width="144" height="80" rx="6" fill="#ffffff"/><rect x="280" y="144" width="144" height="80" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="352" y="167.5" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">During-gen</text><text x="352" y="183.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">64-char sliding buffer</text><text x="352" y="195.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">output rules +</text><text x="352" y="207.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">classifier</text><rect x="536" y="144" width="144" height="80" rx="6" fill="#ffffff"/><rect x="536" y="144" width="144" height="80" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="608" y="173.5" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">Post-gen</text><text x="608" y="189.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">classifier + rules</text><text x="608" y="201.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">on the full output</text><rect x="792" y="152" width="144" height="64" rx="6" fill="#ffffff"/><rect x="792" y="152" width="144" height="64" rx="6" fill="#59636e" stroke="#59636e" stroke-width="1" fill-opacity="0.10"/><text x="864" y="188" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">User</text><rect x="280" y="264" width="400" height="56" rx="6" fill="#ffffff"/><rect x="280" y="264" width="400" height="56" rx="6" fill="#1f2328" stroke="#1f2328" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="480" y="287.5" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">Withheld message</text><text x="480" y="303.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">[response withheld by safety gate]</text><rect x="280" y="40" width="400" height="64" rx="6" fill="#ffffff"/><rect x="280" y="40" width="400" height="64" rx="6" fill="#1f2328" stroke="#59636e" stroke-width="1" fill-opacity="0.05"/><text x="480" y="67.5" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">RequestTrace</text><text x="480" y="83.5" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">per request + JSONL audit log</text><line x1="40" y1="344" x2="920" y2="344" stroke="#1f2328" stroke-width="0.8" stroke-opacity="0.10"/><text x="40" y="364" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="356" width="24" height="12" rx="2" fill="#59636e" stroke="#59636e" stroke-width="1" fill-opacity="0.10"/><text x="152" y="364" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">user</text><rect x="260" y="356" width="24" height="12" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="292" y="364" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">stage</text><rect x="400" y="356" width="24" height="12" rx="2" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="432" y="364" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">streaming gate</text><rect x="540" y="356" width="24" height="12" rx="2" fill="#1f2328" stroke="#1f2328" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="572" y="364" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">LLM / outcome</text><rect x="680" y="356" width="24" height="12" rx="2" fill="#1f2328" stroke="#59636e" stroke-width="1" fill-opacity="0.05"/><text x="712" y="364" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">audit trace</text><line x1="820" y1="361" x2="844" y2="361" stroke="#59636e" stroke-width="1" stroke-dasharray="4,3"/><text x="852" y="364" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">trace write</text>
</svg>
