<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="safegate-input-title safegate-input-desc" id="safegate-input-root">
<title id="safegate-input-title">safegate input path</title>
<desc id="safegate-input-desc">A prompt is normalised and scored by two detection stages while a content classifier runs in parallel; the rules engine either refuses or escalates to a refusal message, or lets the prompt through to the LLM.</desc>
<defs>
      <style>#safegate-input-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #safegate-input-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#safegate-input-root .diagram-container { overflow-x: visible; }
}</style>
