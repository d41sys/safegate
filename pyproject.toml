[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safegate"
version = "0.1.0"
description = "Constitutional safety gate with prompt injection detection, content classification, and streaming output filtering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
# Optional transformer guards (safegate neural-eval). Never imported on the default path.
guard = ["torch>=2.4", "transformers>=4.44", "safetensors>=0.4"]

[project.scripts]
safegate = "safegate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/safegate"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: trains models / downloads data", "network: needs internet"]
addopts = "-m 'not slow and not network'"
